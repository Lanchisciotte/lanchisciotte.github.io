<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestisci discografia</title><style>body{font:16px Arial,sans-serif;background:#17191b;color:#eee;max-width:900px;margin:35px auto;padding:0 18px}h1{font:40px Georgia}input,textarea{width:100%;box-sizing:border-box;padding:10px;background:#282b2e;border:1px solid #666;color:white;border-radius:4px;margin:5px 0 14px}button{padding:12px 18px;background:#92555c;border:0;color:white;cursor:pointer;margin:6px 6px 6px 0}fieldset{border:1px solid #555;margin:18px 0;padding:18px}legend{font-size:22px;font-family:Georgia}small{color:#bbb}summary{cursor:pointer;margin:12px 0}a{color:#e8b2b7}.warn{background:#30262a;padding:14px;line-height:1.6}</style></head><body><h1>Gestisci la discografia</h1><p class="warn">Questa pagina funziona anche senza Internet. Le modifiche <b>non sono pubblicate automaticamente</b>: alla fine scarica <code>catalogo.js</code> e sostituisci quello presente su GitHub. Le nuove copertine vanno caricate separatamente nella cartella <code>assets</code>.</p><div id="editor"></div><button id="addAlbum">+ Nuovo album</button><button id="save">Scarica catalogo.js aggiornato</button><p><a href="index.html#musica">← Torna al sito</a></p><script src="catalogo.js"></script><script>let data=structuredClone(window.LANCHISCIOTTE_CATALOGO);const root=document.getElementById('editor');function field(parent,label,value,cb){const wrap=document.createElement('label');wrap.textContent=label;const inp=document.createElement('input');inp.value=value||'';inp.oninput=()=>cb(inp.value);wrap.append(inp);parent.append(wrap)}function redraw(){root.replaceChildren();data.albums.forEach((a,ai)=>{const fs=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent='Album '+(ai+1);fs.append(legend);for(const [key,label] of [['title','Titolo album'],['id','Identificativo breve (es. nome-album)'],['cover','Percorso copertina (es. assets/album.jpg)'],['description','Descrizione'],['date','Data'],['duration','Durata'],['soundcloud','Link SoundCloud album']])field(fs,label,a[key],v=>a[key]=v);const heading=document.createElement('h3');heading.textContent='Brani ('+a.tracks.length+')';fs.append(heading);a.tracks.forEach((t,ti)=>{const d=document.createElement('details');const s=document.createElement('summary');s.textContent=(ti+1)+'. '+(t.title||'Nuovo brano');d.append(s);for(const [key,label] of [['title','Titolo'],['cover','Percorso copertina (es. assets/brani/nome.jpg)'],['soundcloud','Link diretto SoundCloud del singolo']])field(d,label,t[key],v=>{t[key]=v;if(key==='title')s.textContent=(ti+1)+'. '+v});const del=document.createElement('button');del.textContent='Elimina brano';del.onclick=()=>{if(confirm('Eliminare il brano?')){a.tracks.splice(ti,1);redraw()}};d.append(del);fs.append(d)});const add=document.createElement('button');add.textContent='+ Aggiungi brano';add.onclick=()=>{a.tracks.push({title:'',cover:'',soundcloud:''});redraw()};fs.append(add);const remove=document.createElement('button');remove.textContent='Elimina album';remove.onclick=()=>{if(confirm('Eliminare album e brani dal catalogo?')){data.albums.splice(ai,1);redraw()}};fs.append(remove);root.append(fs)})}document.getElementById('addAlbum').onclick=()=>{data.albums.push({id:'nuovo-album-'+(data.albums.length+1),title:'Nuovo album',cover:'',description:'',date:'',duration:'',soundcloud:'',tracks:[]});redraw()};document.getElementById('save').onclick=()=>{const file='window.LANCHISCIOTTE_CATALOGO = '+JSON.stringify(data,null,2)+';\n';const blob=new Blob([file],{type:'text/javascript;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='catalogo.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};redraw();</script></body></html>
